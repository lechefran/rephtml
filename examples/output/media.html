<html lang="en">
	<head>
		<title>Media Card</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				background: #fbfaf7;
				color: #2f2f2f;
			}
			main {
				max-width: 720px;
				margin: 40px auto;
			}
			figure {
				margin: 0;
			}
			img {
				display: block;
				max-width: 100%;
				height: auto;
			}
			figcaption {
				padding: 12px 0;
				color: #5f6c72;
			}
		</style>
	</head>
	<body>
		<main>
			<figure style="background: #ffffff; border: 1px solid #ded8cf; padding: 16px;">
				<picture>
					<source srcset="chart-large.webp" media="(min-width: 800px)" type="image/webp">
					<img src="chart.png" alt="Bar chart showing regional revenue" width="640" height="360">
				</picture>
				<figcaption>
					<span>Regional revenue snapshot</span>
				</figcaption>
			</figure>
		</main>
	</body>
</html>
