<html lang="en">
	<head>
		<title>Style Rules</title>
		<style type="text/css">
			body {
				background: #f7f7fb;
				color: #1f2937;
				font-family: Arial, sans-serif;
				margin: 0;
			}

			section {
				background: #ffffff;
				border: 1px solid #d8dee9;
				border-radius: 6px;
				box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
				margin: 48px auto;
				max-width: 520px;
				padding: 24px;
			}

			section h1 {
				font-size: 24px;
				margin: 0 0 8px;
			}

			@media (min-width: 800px) {
				section {
					max-width: 640px;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<section>
				<h1>StyleElement with CSS rules</h1>
				<p>This page builds CSS through StyleRule elements instead of StyleElement.Text.</p>
			</section>
		</main>
	</body>
</html>
