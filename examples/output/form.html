<html lang="en">
	<head>
		<title>Search Form</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				background: #eef4ff;
				color: #243b53;
			}
			main {
				max-width: 560px;
				margin: 48px auto;
			}
			form {
				display: grid;
				gap: 12px;
				background: #ffffff;
				padding: 24px;
				border: 1px solid #c9d8ee;
			}
			input, button {
				font: inherit;
				padding: 10px 12px;
			}
			button {
				background: #1d4ed8;
				color: #ffffff;
				border: 0;
			}
		</style>
	</head>
	<body>
		<main>
			<search>
				<form action="/search" method="get" style="border-radius: 6px;">
					<label for="query">Search reports</label>
					<input type="search" name="q" placeholder="Region or keyword" id="query" style="border: 1px solid #9fb3c8;">
					<button type="submit">Search</button>
				</form>
			</search>
		</main>
	</body>
</html>
